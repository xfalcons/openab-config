apiVersion: apps/v1
kind: Deployment
metadata:
  name: octobroker
  labels:
    app.kubernetes.io/name: octobroker
spec:
  # MCP session pins are in-memory; keep this at one replica unless MCP is disabled.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: octobroker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: octobroker
    spec:
      serviceAccountName: openab
      containers:
        - name: octobroker
          image: ghcr.io/openabdev/octobroker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: OCTOBROKER_CONFIG
              value: /etc/octobroker/config.toml
          volumeMounts:
            - name: config
              mountPath: /etc/octobroker
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: octobroker-config
