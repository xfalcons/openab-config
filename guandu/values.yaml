agents:
  kiro:
    enabled: false

  caocao:
    enabled: true
    nameOverride: "caocao-codex"
    image: "ghcr.io/openabdev/openab-codex:latest"
    configUrl: "https://raw.githubusercontent.com/xfalcons/openab-config/refs/heads/main/guandu/config-caocao.toml"
    secretEnv:
      - name: DISCORD_BOT_TOKEN
        secretName: openab-secret
        secretKey: caocao-discord-bot-token
      - name: SLACK_BOT_TOKEN
        secretName: openab-secret
        secretKey: caocao-slack-bot-token
      - name: SLACK_APP_TOKEN
        secretName: openab-secret
        secretKey: caocao-slack-app-token

  zhangliao:
    enabled: true
    nameOverride: "zhangliao-opencode"
    image: "ghcr.io/openabdev/openab-opencode:latest"
    configUrl: "https://raw.githubusercontent.com/xfalcons/openab-config/refs/heads/main/guandu/config-zhangliao.toml"
    secretEnv:
      - name: DISCORD_BOT_TOKEN
        secretName: openab-secret
        secretKey: zhangliao-discord-bot-token
      - name: SLACK_BOT_TOKEN
        secretName: openab-secret
        secretKey: zhangliao-slack-bot-token
      - name: SLACK_APP_TOKEN
        secretName: openab-secret
        secretKey: zhangliao-slack-app-token